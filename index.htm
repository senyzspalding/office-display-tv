<script>
/* ════════════════════════════════════════════════════════════════════════
   SENYLRC TV DISPLAY BOARD
   ────────────────────────────────────────────────────────────────────────
   Single-page kiosk display that shows:
     • Two merged Google Calendars (general events + public events)
     • A "Staff Schedule" calendar with a rotating cute-animal background
     • A scrolling news ticker (optional, via news-proxy.php)
     • Site/service status dots (web properties, Gmail, Zoom)
     • NWS weather alert banner (optional, via weather-alerts.php)
     • An announcement overlay (configured via board-config.json)

   Data sources (all same-origin PHP proxies — see their own files):
     calendar-proxy.php   → Google Calendar events (service account auth)
     news-proxy.php       → RSS/news aggregation
     weather-alerts.php   → NWS active alerts for configured zones
     google-status.php    → Google Workspace status (Gmail)
     zoom-status.php      → Zoom service status
     board-config.json    → Runtime configuration (calendars, toggles, etc.)

   The whole page force-reloads itself every `reloadSecs` seconds (see
   startCountdown()) so it stays fresh and recovers automatically from
   any JS errors — treat this file as effectively stateless per load.
   ════════════════════════════════════════════════════════════════════════ */

let CFG = null, reloadSecs = 60, countdownVal = 60;

// Matches "Join Zoom Meeting: https://...zoom.us/..." style text (with or
// without a leading label) so we can strip meeting links out of event
// titles/locations before displaying them on the board.
const ZOOM_RE = /(?:(?:Join Zoom|Zoom Meeting|Meeting Link|Click here|Join here|Link)[:\s-]*)?https?:\/\/[a-z0-9.-]*\.?zoom\.us\/[^\s<]*/gi;
function stripLinks(s) { return (s||'').replace(ZOOM_RE,'').replace(/\s{2,}/g,' ').trim(); }

// ── Boot ─────────────────────────────────────────────────────────────
/**
 * Entry point, called once at the bottom of this script.
 * Loads board-config.json, wires up all the status checks / panels,
 * then kicks off the calendar + news fetches and starts auto-scrolling.
 */
async function boot() {
  captureDisplayToken();
  try { const r = await fetch('board-config.json?_='+Date.now()); if(r.ok) CFG=await r.json(); } catch{}
  CFG = CFG || {};
  reloadSecs = countdownVal = CFG.reloadInterval || 60;

  const showNews = CFG.showNews === true;
  if (!showNews) document.getElementById('main').classList.add('no-news');

  buildStatusDots(CFG.statusSites || STATUS_SITES_DEFAULT);
  buildServiceDots();
  setAnnouncement(CFG);
  startClock();
  startCountdown();
  checkSiteStatus();
  checkZoomStatus();
  checkGmailStatus();
  if (CFG.showWeather !== false) {
    checkWeatherAlerts();
    setInterval(checkWeatherAlerts, 5 * 60 * 1000);
  }
  setInterval(checkSiteStatus,  2 * 60 * 1000);
  setInterval(checkZoomStatus,  2 * 60 * 1000);
  setInterval(checkGmailStatus, 2 * 60 * 1000);
  const tasks = [loadCalendars()];
  if (showNews) tasks.push(loadNews());
  await Promise.all(tasks);
  startAutoScroll();
}

// ── Site status ───────────────────────────────────────────────────────
// Default list of external sites to ping for the header status dots,
// used only if board-config.json doesn't supply its own `statusSites`.
const STATUS_SITES_DEFAULT = [
  { name:'hrvh.org',    url:'https://news.hrvh.org',        dotId:'hrvh',    enabled:true },
  { name:'empires.org', url:'https://www.empires.org',      dotId:'empires', enabled:true },
  { name:'SEAL',        url:'https://seal.senylrc.org',     dotId:'seal',    enabled:true },
  { name:'Koha (FDR)', url:'https://fdr.koha.senylrc.org',  dotId:'koha',    enabled:true },
];

/** Renders one status-dot + label per enabled site into the header bar. */
function buildStatusDots(sites) {
  document.getElementById('hdr-status').innerHTML = sites
    .filter(s => s.enabled !== false)
    .map(s => `
      <div class="status-item">
        <div class="status-dot checking" id="sdot-${escHtml(s.dotId||s.name)}" title="${escHtml(s.url)}"></div>
        <span>${escHtml(s.name||s.url)}</span>
      </div>`).join('');
}

/**
 * Pings each configured site with a no-cors HEAD request (we can't read
 * the response, just whether the fetch resolved or threw/timed out) and
 * colors its dot up/down accordingly. If every single site fails, shows
 * the full-screen "internet offline" overlay — this is a heuristic for
 * "the kiosk itself lost its connection" vs. "one site happens to be down".
 */
async function checkSiteStatus() {
  const sites = (CFG?.statusSites || STATUS_SITES_DEFAULT).filter(s => s.enabled !== false);
  let failCount = 0;

  for (const site of sites) {
    const id  = site.dotId || site.name;
    const dot = document.getElementById('sdot-' + id);
    if (!dot) continue;
    dot.className = 'status-dot checking';
    try {
      await fetch(site.url, { method:'HEAD', mode:'no-cors', cache:'no-store',
                               signal:AbortSignal.timeout(6000) });
      dot.className = 'status-dot up';
    } catch {
      dot.className = 'status-dot down';
      failCount++;
    }
  }

  const offlineOverlay = document.getElementById('internet-offline-overlay');
  if (failCount > 0 && failCount === sites.length) {
    if (offlineOverlay) offlineOverlay.style.display = 'flex';
  } else {
    if (offlineOverlay) offlineOverlay.style.display = 'none';
  }
}

// ── Weather alerts ────────────────────────────────────────────────────
let weatherAlerts         = [];
let weatherAlertIndex     = 0;
let weatherCycleTimer     = null;
let weatherCountdownTimer = null;

/** Fetches active NWS alerts (for the configured point) from weather-alerts.php. */
async function checkWeatherAlerts() {
  try {
    const point = CFG?.weatherPoint || '';
    // Always start the query string with '?' — previously this only added
    // '?point=...' when `point` was truthy, so when weatherPoint wasn't
    // set in board-config.json (the normal case, since the point is
    // configured server-side in weather-alerts.php) the URL collapsed to
    // 'weather-alerts.php&_=...' with NO leading '?'. That's not a valid
    // query string — the browser treats it as a literal (nonexistent)
    // filename, the fetch 404s, and checkWeatherAlerts() silently caught
    // the failure and hid the banner even when real alerts were active.
    const url = 'weather-alerts.php?' + (point ? 'point=' + encodeURIComponent(point) + '&' : '') + '_=' + Date.now();
    const r     = await fetch(url);
    const data  = await r.json();
    if (!data.ok) throw new Error(data.error);
    weatherAlerts = data.alerts || [];
    updateWeatherBanner();
  } catch {
    weatherAlerts = [];
    hideWeatherBanner();
  }
}

/** Shows the first alert and, if there's more than one, cycles through them every 8s. */
function updateWeatherBanner() {
  clearInterval(weatherCycleTimer);
  clearInterval(weatherCountdownTimer);
  if (!weatherAlerts.length) { hideWeatherBanner(); return; }

  weatherAlertIndex = 0;
  showWeatherAlert(weatherAlerts[0]);

  // Cycle through multiple alerts every 8 seconds
  if (weatherAlerts.length > 1) {
    weatherCycleTimer = setInterval(() => {
      weatherAlertIndex = (weatherAlertIndex + 1) % weatherAlerts.length;
      showWeatherAlert(weatherAlerts[weatherAlertIndex]);
    }, 8000);
  }

  // Refresh just the "Ends in Xh Ym" text every 60s so it doesn't go
  // stale between rotations/reloads without re-rendering the whole banner.
  weatherCountdownTimer = setInterval(() => {
    const endsEl = document.getElementById('weather-ends');
    if (endsEl && weatherAlerts[weatherAlertIndex]) {
      endsEl.textContent = formatTimeRemaining(weatherAlerts[weatherAlertIndex].ends);
    }
  }, 60000);
}

/** Populates and reveals the weather banner for a single alert object. */
function showWeatherAlert(alert) {
  const banner   = document.getElementById('weather-alert');
  const main     = document.getElementById('main');
  const iconEl   = document.getElementById('weather-icon');
  const eventEl  = document.getElementById('weather-event');
  const headEl   = document.getElementById('weather-headline');
  const areasEl  = document.getElementById('weather-areas');
  const endsEl   = document.getElementById('weather-ends');
  const moreEl   = document.getElementById('weather-more');
  const qrEl     = document.getElementById('weather-qr'); // Add this line

  banner.style.background    = alert.color + 'ee';
  banner.style.borderColor   = alert.color;
  banner.style.color         = isLight(alert.color) ? '#1a1a1a' : '#ffffff';
  iconEl.textContent         = alert.icon;
  eventEl.textContent        = alert.event;
  
  // Shorten headline — strip the issued/until boilerplate
  const shortHead = (alert.headline || alert.event)
    .replace(/issued .* by NWS.*/i, '')
    .replace(/\s+/g, ' ').trim();
  headEl.textContent = shortHead;
  
  // Hardcode the display location exclusively to Eastern Ulster
  areasEl.textContent = "Eastern Ulster";
  
  // Live "Ends in Xh Ym" countdown for the alert currently on screen
  endsEl.textContent  = formatTimeRemaining(alert.ends);
  if (weatherAlerts.length > 1) {
    moreEl.style.display  = 'block';
    moreEl.textContent    = `${weatherAlertIndex + 1} / ${weatherAlerts.length}`;
  } else {
    moreEl.style.display  = 'none';
  }

  // --- ADD THIS QR CODE INJECTION LOGIC ---
  if (alert.qr_code_img) {
    qrEl.style.display = 'block';
    qrEl.innerHTML = `
      <div style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 6px;">
	<img src="${alert.qr_code_img}" style="width: 32px; height: 32px; display: block;" alt="QR" />
        <span style="font-size: 10px; font-weight: 700; color: #111; white-space: nowrap; line-height: 1.1;">Scan for Air Quality</span>
      </div>
    `;
  } else {
    qrEl.style.display = 'none';
    qrEl.innerHTML = '';
  }
  // ----------------------------------------

  banner.classList.add('visible');
  main.classList.add('has-weather');
}

/** Stops the alert cycle/countdown timers and hides the weather banner, restoring the normal panel layout. */
function hideWeatherBanner() {
  clearInterval(weatherCycleTimer);
  clearInterval(weatherCountdownTimer);
  document.getElementById('weather-alert')?.classList.remove('visible');
  document.getElementById('main')?.classList.remove('has-weather');
}

/** Luminance check on a #rrggbb hex color, used to pick readable banner text color. */
function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 155;
}

/**
 * Formats how much time is left until an alert's `ends` timestamp.
 * Returns e.g. "Ends in 3h 42m", "Ends in 18m", or "Expired" if it's
 * already passed (can happen briefly right at the boundary before the
 * next fetch/reload drops it from the feed).
 */
function formatTimeRemaining(endsISO) {
  if (!endsISO) return '';
  const end = new Date(endsISO);
  if (isNaN(end)) return '';
  const msLeft = end - new Date();
  if (msLeft <= 0) return 'Expired';

  const totalMin = Math.floor(msLeft / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;

  if (h === 0) return `Ends in ${m}m`;
  if (m === 0) return `Ends in ${h}h`;
  return `Ends in ${h}h ${m}m`;
}

/**
 * Builds the Gmail + Zoom status-dot markup in the header. Config can
 * override name/dotId/component or product IDs per service; sensible
 * defaults are merged in via Object.assign so partial config still works.
 */
function buildServiceDots() {
  const gmail = Object.assign({enabled:true,name:'Gmail',dotId:'gmail',productId:'prPt2Yra2CbGsbEm9cpC'}, CFG?.gmailCfg||{});
  const meet  = Object.assign({enabled:true,name:'Zoom Meetings',dotId:'zoom-meetings',componentId:'3z7b6jks10hm'}, CFG?.zoomMeetCfg||{});
  const phone = Object.assign({enabled:true,name:'Zoom Phone',dotId:'zoom-phone',componentId:'gwtd6dbkck60'}, CFG?.zoomPhoneCfg||{});
  if (!gmail.dotId) gmail.dotId = 'gmail';
  if (!meet.dotId)  meet.dotId  = 'zoom-meetings';
  if (!phone.dotId) phone.dotId = 'zoom-phone';

  const gmailWrap = document.getElementById('gmail-status-wrap');
  const zoomWrap  = document.getElementById('zoom-status-wrap');

  gmailWrap.innerHTML = gmail.enabled ? `
    <div class="status-item">
      <div class="status-dot checking" id="sdot-${escHtml(gmail.dotId)}" title="${escHtml(gmail.name)}"></div>
      <span>${escHtml(gmail.name)}</span>
    </div>` : '';

  let zoomHtml = '';
  if (meet.enabled)  zoomHtml += `<div class="status-item"><div class="status-dot checking" id="sdot-${escHtml(meet.dotId)}" title="${escHtml(meet.name)}"></div><span>${escHtml(meet.name)}</span></div>`;
  if (phone.enabled) zoomHtml += `<div class="status-item"><div class="status-dot checking" id="sdot-${escHtml(phone.dotId)}" title="${escHtml(phone.name)}"></div><span>${escHtml(phone.name)}</span></div>`;
  zoomWrap.innerHTML = zoomHtml;
  gmailWrap.style.display = gmail.enabled ? '' : 'none';
  zoomWrap.style.display  = (meet.enabled || phone.enabled) ? '' : 'none';
}

// ── Gmail status ──────────────────────────────────────────────────────
/** Polls google-status.php for Gmail's current Workspace status and updates its dot. */
async function checkGmailStatus() {
  const cfg = Object.assign({enabled:true,dotId:'gmail',productId:'prPt2Yra2CbGsbEm9cpC'}, CFG?.gmailCfg||{});
  if (!cfg.dotId) cfg.dotId = 'gmail';
  if (!cfg.enabled) return;
  const dot = document.getElementById('sdot-' + cfg.dotId);
  if (!dot) return;
  dot.className = 'status-dot checking';
  try {
    const pid = cfg.productId || 'prPt2Yra2CbGsbEm9cpC';
    const r   = await fetch(`google-status.php?productId=${encodeURIComponent(pid)}&_=${Date.now()}`);
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'proxy error');
    const s = data.gmail?.status || 'unknown';
    dot.className = 'status-dot ' + s;
    dot.title     = data.gmail?.description || s;
  } catch(e) {
    dot.className = 'status-dot down';
    dot.title     = 'Error: ' + e.message;
  }
}

// ── Zoom status ───────────────────────────────────────────────────────
/** Polls zoom-status.php for Zoom Meetings + Zoom Phone status and updates their dots. */
async function checkZoomStatus() {
  const meet  = Object.assign({enabled:true,dotId:'zoom-meetings',componentId:'3z7b6jks10hm',name:'Zoom Meetings'}, CFG?.zoomMeetCfg||{});
  const phone = Object.assign({enabled:true,dotId:'zoom-phone',componentId:'gwtd6dbkck60',name:'Zoom Phone'},    CFG?.zoomPhoneCfg||{});
  if (!meet.dotId)  meet.dotId  = 'zoom-meetings';
  if (!phone.dotId) phone.dotId = 'zoom-phone';

  const meetDot  = meet.enabled  ? document.getElementById('sdot-' + meet.dotId)  : null;
  const phoneDot = phone.enabled ? document.getElementById('sdot-' + phone.dotId) : null;

  if (meetDot)  meetDot.className  = 'status-dot checking';
  if (phoneDot) phoneDot.className = 'status-dot checking';
  if (!meet.enabled && !phone.enabled) return;

  const setDot = (el, status) => {
    if (!el) return;
    el.className = 'status-dot ' + (status || 'down');
    el.title = status==='up' ? 'Operational' : status==='degraded' ? 'Degraded' : status==='down' ? 'Outage' : 'Unknown';
  };

  try {
    const mId = meet.componentId  || '3z7b6jks10hm';
    const pId = phone.componentId || 'gwtd6dbkck60';
    const r   = await fetch(`zoom-status.php?meetId=${encodeURIComponent(mId)}&phoneId=${encodeURIComponent(pId)}&_=${Date.now()}`);
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'proxy error');
    setDot(meetDot,  data.services?.zoom_meetings?.status);
    setDot(phoneDot, data.services?.zoom_phone_na?.status);
  } catch(e) {
    if (meetDot)  { meetDot.className  = 'status-dot down'; meetDot.title  = 'Error: '+e.message; }
    if (phoneDot) { phoneDot.className = 'status-dot down'; phoneDot.title = 'Error: '+e.message; }
  }
}

/**
 * Shows/hides + populates the bottom announcement overlay based on
 * board-config.json's `announcement`/`showAnnouncement`/`annExpireDate`
 * fields. If an expiry is set and already passed, the overlay stays
 * hidden; if it's set and still in the future, schedules a one-shot
 * re-check (setAnnouncement again) for the moment it expires, so the
 * banner disappears live without waiting for the next full page reload.
 */
function setAnnouncement(cfg) {
  const text    = (cfg.announcement || '').trim();
  const enabled = cfg.showAnnouncement === true;
  const overlay = document.getElementById('ann-overlay');
  const main    = document.getElementById('main');

  if (!enabled || text.length < 5) {
    overlay.classList.remove('visible');
    main.classList.remove('has-announcement');
    return;
  }

  // Check expiry
  if (cfg.annExpireDate) {
    const expireStr = cfg.annExpireDate + 'T' + (cfg.annExpireTime || '23:59');
    const expires   = new Date(expireStr);
    if (!isNaN(expires) && expires <= new Date()) {
      overlay.classList.remove('visible');
      main.classList.remove('has-announcement');
      return;
    }
    document.getElementById('ann-expire-info').textContent =
      'Expires ' + expires.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    // Auto-hide when it expires (if within 24h)
    const msLeft = expires - new Date();
    if (msLeft > 0 && msLeft < 86400000) setTimeout(() => setAnnouncement(cfg), msLeft + 500);
  } else {
    document.getElementById('ann-expire-info').textContent = '';
  }

  document.getElementById('ann-text').textContent = text;
  overlay.classList.add('visible');
  main.classList.add('has-announcement');
}

// ── Clock ─────────────────────────────────────────────────────────────
/** Starts the header's live HH:MM:SS clock, using the kiosk's local time. */
function startClock() {
  const tick = () => {
    const n = new Date();
    let h = n.getHours(), m = n.getMinutes(), s = n.getSeconds();
    const ap = h>=12?'PM':'AM'; h = h%12||12;
    document.getElementById('hdr-clock').textContent = pad(h)+':'+pad(m)+':'+pad(s)+' '+ap;
  };
  tick(); setInterval(tick, 1000);
}

// ── Reload countdown ──────────────────────────────────────────────────
/**
 * Drives the thin progress bar at the bottom of the screen and forces a
 * full page reload once `reloadSecs` elapses. This is the board's main
 * "refresh" mechanism — rather than re-fetching data in place, the whole
 * page just reloads, which keeps things simple and self-healing.
 */
function startCountdown() {
  const fill = document.getElementById('reload-fill');
  fill.style.width = '100%';
  setInterval(() => {
    countdownVal--;
    fill.style.width = Math.max(0,(countdownVal/reloadSecs)*100)+'%';
    if (countdownVal <= 0) window.location.reload();
  }, 1000);
}

// ── Display token (authenticates this TV to calendar-proxy.php) ───────
// Set once per TV by opening the board as  .../index.htm#key=<DISPLAY_TOKEN>
// (DISPLAY_TOKEN lives in config.local.php on the server). It is kept in this
// browser's localStorage and the address bar is cleaned up. The fragment is
// never sent to the server, so the token stays out of access logs.
const DISPLAY_TOKEN_KEY = 'senytv.displayToken';
/** If the URL carries #key=..., saves it to localStorage and strips it from the address bar. */
function captureDisplayToken() {
  const m = location.hash.match(/[#&]key=([^&]+)/);
  if (!m) return;
  try { localStorage.setItem(DISPLAY_TOKEN_KEY, decodeURIComponent(m[1])); } catch {}
  history.replaceState(null, '', location.pathname + location.search);
}
// Pasting #key=... onto an already-open board only changes the hash (no reload), so handle that too.
window.addEventListener('hashchange', () => {
  if (/[#&]key=/.test(location.hash)) { captureDisplayToken(); location.reload(); }
});
/** Returns the saved display token, or '' if this TV has not been set up. */
function displayToken() {
  try { return localStorage.getItem(DISPLAY_TOKEN_KEY) || ''; } catch { return ''; }
}

// ── Calendars ─────────────────────────────────────────────────────────
/**
 * Fetches calendar-proxy.php and renders both calendar panels:
 *   - "Events & Calendar" = calendars[0] + calendars[1] merged together
 *   - "Staff Schedule"    = calendars[2]
 * (Indexes match the $CALENDAR_IDS order configured in calendar-proxy.php.)
 *
 * Handles three failure modes distinctly so the on-screen error is
 * useful for troubleshooting: PHP returning non-JSON (syntax error,
 * fatal, etc.), the fetch itself failing (network/DNS), and the proxy
 * returning valid JSON with `ok:false` (e.g. bad service account key).
 */
async function loadCalendars() {
  document.getElementById('cal-scroll-merged').innerHTML = '<div class="cal-empty">Loading…</div>';
  document.getElementById('cal-scroll-2').innerHTML      = '<div class="cal-empty">Loading…</div>';

  let data;
  try {
    const r = await fetch('calendar-proxy.php?_='+Date.now(), {
      cache: 'no-store',
      headers: { 'X-Display-Token': displayToken() }
    });
    const rawText = await r.text();
    try {
      data = JSON.parse(rawText);
      if (r.status === 401) {
        data = { ok:false, error:'This display is not authorized. Open the board once with #key=<display token> added to the address.' };
      }
    } catch {
      // PHP returned non-JSON — show the raw error
      const preview = rawText.replace(/<[^>]*>/g,'').trim().substring(0,200);
      ['cal-scroll-merged','cal-scroll-2'].forEach(id => {
        document.getElementById(id).innerHTML =
          `<div class="cal-empty">⚠️ calendar-proxy.php error:<br><code style="font-size:11px;color:#f87171">${escHtml(preview)}</code></div>`;
      });
      return;
    }
  } catch(e) {
    ['cal-scroll-merged','cal-scroll-2'].forEach(id => {
      document.getElementById(id).innerHTML = `<div class="cal-empty">⚠️ Could not reach calendar-proxy.php<br><small>${escHtml(e.message)}</small></div>`;
    });
    return;
  }

  if (!data.ok) {
    ['cal-scroll-merged','cal-scroll-2'].forEach(id => {
      document.getElementById(id).innerHTML = `<div class="cal-empty">⚠️ ${escHtml(data.error||'Proxy error')}</div>`;
    });
    return;
  }

  const cals = data.calendars || [];

  // Calendars 0 + 1 merged into Events & Calendar column
  const mergedEvents = [];
  [0,1].forEach(idx => {
    if (!cals[idx]) return;
    (cals[idx].events||[]).forEach(ev => {
      mergedEvents.push({ ...ev, _calLabel: cals[idx].label, _calColor: cals[idx].color, _calIdx: idx });
    });
  });
  mergedEvents.sort((a,b) => {
    const ta = a.start.dateTime || a.start.date;
    const tb = b.start.dateTime || b.start.date;
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });

  const mergedEl = document.getElementById('cal-scroll-merged');
  const badge0   = document.getElementById('cal-badge-merged');
  if (!mergedEvents.length) {
    mergedEl.innerHTML = '<div class="cal-empty">No events in the next 2 days</div>';
    badge0.textContent = '0 events';
  } else {
    renderMergedEvents(mergedEl, mergedEvents);
    badge0.textContent = mergedEvents.length + ' events';
  }

  // Calendar index 2 = Staff Schedule
  const staffCal = cals[2];
  const staffEl  = document.getElementById('cal-scroll-2');
  const badge2   = document.getElementById('cal-badge-2');
  if (!staffCal) {
    staffEl.innerHTML = '<div class="cal-empty">Staff Schedule not configured</div>';
  } else if (staffCal.error) {
    staffEl.innerHTML = `<div class="cal-empty">⚠️ ${escHtml(staffCal.error)}</div>`;
  } else if (!staffCal.events?.length) {
    staffEl.innerHTML = '<div class="cal-empty">No upcoming schedule</div>';
    badge2.textContent = '0 events';
  } else {
    renderCalEvents(staffEl, staffCal.events, staffCal.color||'#517C5C');
    badge2.textContent = staffCal.events.length + ' events';
  }
}

/**
 * Given an all-day event (has start.date / end.date, no start.dateTime),
 * returns an array of 'YYYY-MM-DD' keys for every day it spans.
 *
 * Google Calendar's `end.date` for all-day events is EXCLUSIVE — e.g. a
 * single one-day event on June 30 has start.date "2026-06-30" and
 * end.date "2026-07-01". A 2-day event spanning Mon–Tue has end.date
 * set to Wednesday. We loop from start (inclusive) up to but not
 * including end, so the event shows up under every day it's actually
 * active — not just its first day.
 *
 * FIX (multi-day all-day events): previously the calendar renderers only
 * ever bucketed an event under its start date, so something like a
 * 2-day "Out: LG" entry starting Monday would only ever appear under
 * "Mon, Jun 29" and silently vanish from Tuesday's list even though it
 * was still in effect. This helper is what lets both render functions
 * file the event under every day it spans instead.
 */
function expandAllDayDates(ev) {
  const dates = [];
  if (!ev.start?.date || !ev.end?.date) {
    // Not an all-day event (or malformed) — just use start as a single day
    const single = (ev.start?.dateTime || ev.start?.date || '').substring(0,10);
    if (single) dates.push(single);
    return dates;
  }
  // Parse as local-time Y/M/D (NOT `new Date(str)`) so we don't get
  // shifted a day by UTC parsing — see the timezone note further down.
  const [sy, sm, sd] = ev.start.date.split('-').map(Number);
  const [ey, em, ed] = ev.end.date.split('-').map(Number);
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(sy, sm - 1, sd);
  let cur = start < today ? new Date(today) : start; // clamp out past days
  const end = new Date(ey, em - 1, ed); // exclusive end
  while (cur < end) {
    const y = cur.getFullYear();
    const m = String(cur.getMonth()+1).padStart(2,'0');
    const d = String(cur.getDate()).padStart(2,'0');
    dates.push(`${y}-${m}-${d}`);
    cur.setDate(cur.getDate() + 1);
  }
  return dates.length ? dates : [ev.start.date];
}
/**
 * Renders the merged "Events & Calendar" panel: groups events by day
 * (expanding multi-day all-day events across every day they span — see
 * expandAllDayDates), then renders a sticky day-header followed by each
 * event's time/title/location, tagged with which source calendar it
 * came from.
 */
function renderMergedEvents(container, events) {
  const groups = {};
  events.forEach(ev => {
    const isAllDay = ev.allDay || (!!ev.start.date && !ev.start.dateTime);
    const dates = isAllDay
      ? expandAllDayDates(ev)
      : [(ev.start.dateTime || ev.start.date).substring(0,10)];
    dates.forEach(date => {
      if (!groups[date]) groups[date] = [];
      groups[date].push(ev);
    });
  });

  let html = '';
  Object.keys(groups).sort().forEach(date => {
    const d     = new Date(date+'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff  = Math.round((d-today)/86400000);
    const label = diff===0 ? 'Today — '+fmtDate(d)
                : diff===1 ? 'Tomorrow — '+fmtDate(d)
                : fmtDate(d);
    html += `<div class="cal-day-header">${escHtml(label)}</div>`;
    groups[date].forEach(ev => {
      const isAllDay = ev.allDay || (!!ev.start.date && !ev.start.dateTime);
      const timeStr  = isAllDay ? `<span class="cal-time allday">ALL DAY</span>`
                                : `<span class="cal-time">${fmtTime(new Date(ev.start.dateTime))}</span>`;
      const summary  = escHtml(stripLinks(ev.summary||'(No title)'));
      const loc      = ev.location ? stripLinks(ev.location.split(',')[0]) : '';
      const locHtml  = loc ? `<div class="cal-sub">📍 ${escHtml(loc)}</div>` : '';
      // Show which calendar the event is from
      const isPublic = ev._calIdx === 1;
      const tagHtml  = `<span class="cal-source-tag${isPublic?' public':''}">${escHtml(ev._calLabel||'')}</span>`;
      html += `
        <div class="cal-event">
          ${timeStr}
          <div class="cal-bar" style="background:${ev._calColor||'#0081B5'}"></div>
          <div>
            <div class="cal-summary">${summary}</div>
            ${locHtml}
            ${tagHtml}
          </div>
        </div>`;
    });
  });
  container.innerHTML = html;
}

/**
 * Renders a single-calendar panel (used for "Staff Schedule"). Same
 * day-grouping/multi-day-expansion logic as renderMergedEvents, plus a
 * staff-schedule-specific filter: entries like "Remote:", "Out:", or
 * "In office:" with nothing meaningful after the colon are skipped
 * entirely (treated as placeholder/blank entries rather than real
 * schedule items).
 */
function renderCalEvents(container, events, color) {
  const groups = {};
  events.forEach(ev => {
    // Skip staff schedule entries where nothing meaningful follows the colon
    // Handles: "Remote:", "Out:", "In office:", "Remote: -", "Out:  " etc.
    const raw = (ev.summary || '').trim();
    const colonIdx = raw.indexOf(':');
    if (colonIdx !== -1) {
      const afterColon = raw.substring(colonIdx + 1).trim().replace(/^[-–—]+$/, '');
      if (afterColon.length === 0) return;
    }

    const isAllDay = ev.allDay || (!!ev.start.date && !ev.start.dateTime);
    const dates = isAllDay
      ? expandAllDayDates(ev)
      : [(ev.start.dateTime || ev.start.date).substring(0,10)];
    dates.forEach(date => {
      if (!groups[date]) groups[date] = [];
      groups[date].push(ev);
    });
  });
  let html = '';
  Object.keys(groups).sort().forEach(date => {
    const d     = new Date(date+'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff  = Math.round((d-today)/86400000);
    const label = diff===0?'Today — '+fmtDate(d):diff===1?'Tomorrow — '+fmtDate(d):fmtDate(d);
    html += `<div class="cal-day-header">${escHtml(label)}</div>`;
    groups[date].forEach(ev => {
      const isAllDay = ev.allDay || (!!ev.start.date && !ev.start.dateTime);
      const timeStr  = isAllDay ? `<span class="cal-time allday">ALL DAY</span>`
                                : `<span class="cal-time">${fmtTime(new Date(ev.start.dateTime))}</span>`;
      const summary  = escHtml(stripLinks(ev.summary||'(No title)'));
      const loc      = ev.location ? stripLinks(ev.location.split(',')[0]) : '';
      const locHtml  = loc ? `<div class="cal-sub">📍 ${escHtml(loc)}</div>` : '';
      html += `
        <div class="cal-event">
          ${timeStr}
          <div class="cal-bar" style="background:${color}"></div>
          <div><div class="cal-summary">${summary}</div>${locHtml}</div>
        </div>`;
    });
  });
  container.innerHTML = html;
}

// ── News ──────────────────────────────────────────────────────────────
/** Fetches news-proxy.php and renders the scrolling headline list (only if showNews is on). */
async function loadNews() {
  const el = document.getElementById('news-scroll');
  el.innerHTML = '<div class="cal-empty">Loading news…</div>';
  let data;
  try { const r = await fetch('news-proxy.php?_='+Date.now()); data = await r.json(); }
  catch { el.innerHTML = '<div class="cal-empty">⚠️ Could not reach news-proxy.php</div>'; return; }
  if (!data.ok || !data.items?.length) {
    el.innerHTML = '<div class="cal-empty">⚠️ Could not load news feeds.</div>'; return;
  }
  el.innerHTML = data.items.map((item,i) => `
    <div class="news-item">
      <div class="news-n">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="news-source">${escHtml(item.source)}</div>
        <div class="news-headline">${escHtml(item.title)}</div>
        ${item.pubDate?`<div class="news-age">${timeAgo(new Date(item.pubDate))}</div>`:''}
      </div>
    </div>`).join('');
  document.getElementById('news-badge').textContent = data.items.length+' stories';
}

// ── Auto-scroll all panels ────────────────────────────────────────────
/**
 * Sets up a slow, self-pausing auto-scroll loop for each scrollable
 * panel (calendars + news): pause at the top to let it be read, creep
 * down 1px at a time, pause at the bottom, then snap back to the top
 * and repeat. Panels whose content fits without overflow are simply
 * left alone (checked on every loop in case content changes size).
 */
function startAutoScroll() {
  ['cal-scroll-merged', 'cal-scroll-2', 'news-scroll'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const speed      = id === 'news-scroll' ? 35 : 40; // ms per pixel step
    const pauseTop   = 3000;  // ms to pause at the top before scrolling
    const pauseBottom= 2000;  // ms to pause at the bottom before jumping back

    let timer = null;
    let pausing = false;

    function step() {
      // Only scroll if content is meaningfully taller than the container
      // (at least 40px overflow — avoids stuttering on barely-over content)
      const overflow = el.scrollHeight - el.clientHeight;
      if (overflow < 40) {
        // Content fits — nothing to scroll, check again after a bit
        timer = setTimeout(step, 1000);
        return;
      }

      if (pausing) return;

      const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 2;

      if (atBottom) {
        // Pause at bottom, then snap back to top and pause again
        pausing = true;
        setTimeout(() => {
          el.scrollTop = 0;
          pausing = false;
          timer = setTimeout(step, pauseTop);
        }, pauseBottom);
      } else {
        el.scrollTop += 1;
        timer = setTimeout(step, speed);
      }
    }

    // Start with a pause at the top so content is readable before moving
    timer = setTimeout(step, pauseTop);
  });
}

// ── Helpers ───────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }
/** Formats a Date as e.g. "Mon, Jul 21". */
function fmtDate(d) { return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
/** Formats a Date as a compact 12h time, e.g. "9a", "2:30p" (minutes omitted on the hour). */
function fmtTime(d) {
  let h=d.getHours(), m=d.getMinutes();
  const ap=h>=12?'p':'a'; h=h%12||12;
  return h+(m?':'+pad(m):'')+ap;
}
/** Returns a relative age such as "just now", "5m ago", "3h ago" or "2d ago"; "" for an invalid date. */
function timeAgo(date) {
  if(isNaN(date)) return '';
  const diff=Math.floor((Date.now()-date)/60000);
  if(diff<1) return 'just now';
  if(diff<60) return diff+'m ago';
  const h=Math.floor(diff/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
/** Escapes a string for safe injection into innerHTML (used everywhere we render API/proxy text). */
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Keep-awake ────────────────────────────────────────────────────────
/**
 * Tries the Screen Wake Lock API first (reacquiring it on visibility
 * change, since browsers release the lock when the tab is hidden), then
 * falls back to a muted looping video, and finally to a near-invisible
 * canvas being redrawn periodically — belt-and-suspenders against kiosk
 * hardware/OS screensavers and sleep timers. Also nudges the clock with
 * a synthetic mousemove every 30s as a last-resort "activity" signal.
 */
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState==='visible')
          try { await navigator.wakeLock.request('screen'); } catch{}
      });
    }
  } catch{}
  const v = document.getElementById('wake-video');
  if (v) {
    v.play().catch(() => {
      const c = document.createElement('canvas');
      c.width=c.height=1;
      c.style.cssText='position:fixed;width:1px;height:1px;top:0;left:0;opacity:0.01;pointer-events:none;z-index:-1';
      document.body.appendChild(c);
      const ctx=c.getContext('2d');
      setInterval(()=>{ ctx.fillStyle=Math.random()>.5?'#000001':'#000000'; ctx.fillRect(0,0,1,1); },25000);
    });
    v.addEventListener('pause', ()=>{ try{v.play();}catch{} });
  }
  setInterval(()=>{
    document.getElementById('hdr-clock')?.dispatchEvent(new MouseEvent('mousemove',{bubbles:true}));
    const vid=document.getElementById('wake-video');
    if(vid?.paused) try{vid.play();}catch{}
  }, 30000);
}

// ── Cute animal background ────────────────────────────────────────────
// Each fetcher hits a free public animal-image API and normalizes its
// response into { url, caption }. Used to rotate a subtle background
// image behind the Staff Schedule panel (purely decorative).
const ANIMAL_FEED_MAP = {
  cat:   fetchCat,
  dog:   fetchDog,
  fox:   fetchFox,
  duck:  fetchDuck,
  bunny: fetchBunny,
  bird:  fetchBird,
  panda: fetchPanda,
};

/** Animal feed fetchers (fetchCat..fetchPanda): each calls a free public image API and resolves to {url, caption} for the rotating background. Registered in ANIMAL_FETCHERS by feed key. */
async function fetchCat() {
  const r = await fetch('https://api.thecatapi.com/v1/images/search');
  const d = await r.json();
  return { url: d[0].url, caption: '🐱 Kitty!' };
}
/** Dog image from dog.ceo; caption uses the breed parsed from the image URL. */
async function fetchDog() {
  const r = await fetch('https://dog.ceo/api/breeds/image/random');
  const d = await r.json();
  const breed = d.message.split('/')[4]?.replace(/-/g,' ') || 'dog';
  return { url: d.message, caption: `🐶 ${breed.charAt(0).toUpperCase()+breed.slice(1)}!` };
}
/** Fox image from randomfox.ca. */
async function fetchFox() {
  const r = await fetch('https://randomfox.ca/floof/');
  const d = await r.json();
  return { url: d.image, caption: '🦊 What does the fox say?' };
}
/** Duck image from random-d.uk. */
async function fetchDuck() {
  const r = await fetch('https://random-d.uk/api/random');
  const d = await r.json();
  return { url: d.url, caption: '🦆 Quack!' };
}
/** Bunny image from api.bunnies.io. */
async function fetchBunny() {
  const r = await fetch('https://api.bunnies.io/v2/loop/random/?media=gif,png');
  const d = await r.json();
  return { url: d.media.gif || d.media.png, caption: '🐰 Bun bun!' };
}
/** Bird image from some-random-api.com. */
async function fetchBird() {
  const r = await fetch('https://some-random-api.com/img/birb');
  const d = await r.json();
  return { url: d.link, caption: '🐦 Tweet tweet!' };
}
/** Panda image from some-random-api.com. */
async function fetchPanda() {
  const r = await fetch('https://some-random-api.com/img/panda');
  const d = await r.json();
  return { url: d.link, caption: '🐼 Nom nom bamboo!' };
}

let lastAnimalSource = -1;
let animalSources    = [];
let animalIntervalMs = 45000;

/**
 * Picks a random animal source (different from the last one shown, when
 * more than one is enabled), fetches an image, and cross-fades it in as
 * the Staff Schedule panel's background once it's preloaded.
 */
async function loadNextAnimal() {
  const bg      = document.getElementById('animal-bg');
  const caption = document.getElementById('animal-caption');
  if (!bg || !animalSources.length) return;

  let idx;
  do { idx = Math.floor(Math.random() * animalSources.length); }
  while (idx === lastAnimalSource && animalSources.length > 1);
  lastAnimalSource = idx;

  try {
    const { url, caption: cap } = await animalSources[idx]();
    const img = new Image();
    img.onload = () => {
      bg.classList.remove('visible');
      setTimeout(() => {
        bg.style.backgroundImage = `url('${url}')`;
        bg.classList.add('visible');
        if (caption) caption.textContent = cap;
      }, 200);
    };
    img.onerror = () => setTimeout(loadNextAnimal, 2000);
    img.src = url;
  } catch {
    setTimeout(loadNextAnimal, 3000);
  }
}

/**
 * Reads animal-rotation settings from board-config.json (showAnimals,
 * animalOpacity, animalFeeds, animalInterval) and, if enabled, starts
 * the rotation loop. Safe no-op if showAnimals is false or no valid
 * feeds are configured.
 */
function startAnimalRotation() {
  // Read settings from config
  const showAnimals = CFG?.showAnimals !== false; // default on
  if (!showAnimals) return;

  // Opacity from config (default 45)
  const opacity = (CFG?.animalOpacity || 45) / 100;
  const style = document.getElementById('animal-bg');
  if (style) {
    // Inject the opacity as a CSS custom property override
    document.documentElement.style.setProperty('--animal-opacity', opacity);
  }

  // Which feeds to use
  const enabledFeeds = CFG?.animalFeeds?.length
    ? CFG.animalFeeds
    : ['cat','dog','fox','duck','bunny'];
  animalSources = enabledFeeds
    .filter(k => ANIMAL_FEED_MAP[k])
    .map(k => ANIMAL_FEED_MAP[k]);
  if (!animalSources.length) return;

  // Interval from config (default 45s)
  animalIntervalMs = (CFG?.animalInterval || 45) * 1000;

  loadNextAnimal();
  setInterval(loadNextAnimal, animalIntervalMs);
}

keepAwake();
boot();
startAnimalRotation();
